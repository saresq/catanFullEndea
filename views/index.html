<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{t.page.title}}</title>
  {{> meta}}
  <link rel="preload" as="font" type="font/woff2" href="/css/fonts/AlegreyaSans-Regular.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/css/fonts/AlegreyaSans-Bold.woff2" crossorigin>
  <!-- Cards seen in the first minute. Add each resource face here as its .webp lands in /images/cards -->
  <link rel="preload" as="image" href="/images/cards/sheep.webp">
  <link rel="preload" as="image" href="/images/cards/lumber.webp">
  <link rel="preload" as="image" href="/images/cards/brick.webp">
  <link rel="preload" as="image" href="/images/cards/ore.webp">
  <link rel="preload" as="image" href="/images/cards/wheat.webp">
  <link rel="preload" as="image" href="/images/cards/res-back.webp">
  <link rel="preload" as="image" href="/images/cards/dev-back.webp">
  <link rel="stylesheet" href="/css/index.css">
  <link rel="shortcut icon" type="image/jpg" href="/images/favicon.png" />
</head>
<div class="splash"></div>
<div id="game">
  <div class="board-container">
    <div class="board"></div>
  </div>
  <div class="resource-animation-zone"></div>
  <div class="current-player">
    <div class="hand"></div>
    <div class="actions"></div>
    <div class="status-bar">
      <span class="status-text"></span>
      <button class="btn btn--quiet btn--sm history-toggle" aria-expanded="false">{{t.dock.history}}</button>
    </div>
    <div class="status-history-zone panel">
      <div class="title">{{t.dock.history}}<button class="close" title="{{t.keys.h}}">X</button></div>
      <div class="now"></div>
      <div class="container"></div>
    </div>
    <div class="trade-zone">
      <div class="trade-requests"></div>
      <div class="trade-card-selection panel panel--drawer hide"></div>
      <div class="robber-drop-zone panel panel--drawer hide"></div>
      <div class="resource-selection-zone panel panel--drawer hide"></div>
    </div>
  </div>
  <div class="card-preview-zone hide">
    <button class="close" title="{{t.keys.esc}}">𝖷</button>
    <div class="card-container">
      <div class="card card--xl card--flip">
        <div class="card-front"></div>
        <div class="card-back"></div>
      </div>
    </div>
    <button class="btn btn--primary activate hide">{{t.dock.activate}}</button>
    <div class="info hide">{{t.dock.dev_info_1}}
      <br>{{t.dock.dev_info_2}}
    </div>
  </div>
  <div class="animation-zone"></div>
  <div class="alert">
    <div class="text panel"></div>
    <button class="close">X</button>
  </div>
  <div class="hud-top">
    <div class="all-players"></div>
    <div class="accessibility-zone"></div>
  </div>
</div>
<svg style="width: 0;height: 0;">
  <filter id="wavy2">
    <feTurbulence x="0" y="0" baseFrequency="0.02" numOctaves="5" seed="1"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" scale="20"></feDisplacementMap>
  </filter>
</svg>

<script>
  window.game_obj = {{{game}}};
  window.player_obj = {{{player}}};
  window.opponents_obj = {{{opponents}}};
</script>
<script src="/socket.io/socket.io.min.js"></script>
<script src="/js/index.js" type="module"></script>
</html>
