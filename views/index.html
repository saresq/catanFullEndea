<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catan Full Endea</title>
  <!-- Link previews (WhatsApp, Telegram, Discord, Slack, iMessage, X...) -->
  <meta name="description" content="Catan como siempre debió ser, full endea." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Endea" />
  <meta property="og:locale" content="es_AR" />
  <meta property="og:title" content="Catan Full Endea" />
  <meta property="og:description" content="Catan como siempre debió ser, full endea." />
  <meta property="og:image" content="https://catan.endea.ar/images/og-image.jpg" />
  <meta property="og:image:secure_url" content="https://catan.endea.ar/images/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Catan Full Endea: paisaje al atardecer en un marco dorado" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Catan Full Endea" />
  <meta name="twitter:description" content="Catan como siempre debió ser, full endea." />
  <meta name="twitter:image" content="https://catan.endea.ar/images/og-image.jpg" />
  <meta name="twitter:image:alt" content="Catan Full Endea: paisaje al atardecer en un marco dorado" />
  <link rel="stylesheet" href="/css/index.css">
  <link rel="shortcut icon" type="image/jpg" href="/images/favicon.png" />
</head>
<div class="splash"></div>
<div id="game">
  <div class="board-container">
    <div class="board"></div>
  </div>
  <div class="resource-animation-zone"></div>
  <div class="current-player">
    <div class="hand"></div>
    <div class="actions"></div>
    <div class="status-bar"></div>
  </div>
  <div class="trade-zone">
    <div class="trade-requests"></div>
    <div class="trade-type-selection hide"></div>
    <div class="trade-card-selection hide"></div>
  </div>
  <div class="robber-drop-zone">
    <div class="card-area"></div>
    <div class="drop-actions">
      <div class="drop-emoji">🥷</div>
      <div class="dropped-count" data-count="0"></div>
      <div class="drop-give-button">Let Go!</div>
    </div>
  </div>
  <div class="resource-selection-zone hide"></div>
  <div class="status-history-zone">
    <div class="title">History<button class="close" title="H">X</button></div>
    <div class="container"></div>
  </div>
  <div class="card-preview-zone hide">
    <button class="close" title="Esc">𝖷</button>
    <div class="card-container">
      <div class="card">
        <div class="card-front"></div>
        <div class="card-back"></div>
      </div>
    </div>
    <button class="activate hide">Activate</button>
    <div class="info hide">→ You can only activate one Development card per turn.
      <br>→ You can not play the card you just bought this turn.
    </div>
  </div>
  <div class="animation-zone"></div>
  <div class="alert">
    <div class="text"></div>
    <button class="close">X</button>
  </div>
  <div class="hud-top">
    <div class="all-players"></div>
    <div class="accessibility-zone"></div>
    <div class="status-history-icon-zone">
      <button class="icon status-bar-history right" title="Status History (h)"></button>
    </div>
  </div>
</div>
<svg style="width: 0;height: 0;">
  <filter id="wavy2">
    <feTurbulence x="0" y="0" baseFrequency="0.02" numOctaves="5" seed="1"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" scale="20"></feDisplacementMap>
  </filter>
</svg>

<script>
  window.game_obj = {{{game}}};
  window.player_obj = {{{player}}};
  window.opponents_obj = {{{opponents}}};
</script>
<script src="/socket.io/socket.io.min.js"></script>
<script src="/js/index.js" type="module"></script>
