<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catan Full Endea</title>
  <!-- Link previews (WhatsApp, Telegram, Discord, Slack, iMessage, X...) -->
  <meta name="description" content="Catan como siempre debió ser, full endea." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Endea" />
  <meta property="og:locale" content="es_AR" />
  <meta property="og:title" content="Catan Full Endea" />
  <meta property="og:description" content="Catan como siempre debió ser, full endea." />
  <meta property="og:image" content="https://catan.endea.ar/images/og-image.jpg" />
  <meta property="og:image:secure_url" content="https://catan.endea.ar/images/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Catan Full Endea: paisaje al atardecer en un marco dorado" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Catan Full Endea" />
  <meta name="twitter:description" content="Catan como siempre debió ser, full endea." />
  <meta name="twitter:image" content="https://catan.endea.ar/images/og-image.jpg" />
  <meta name="twitter:image:alt" content="Catan Full Endea: paisaje al atardecer en un marco dorado" />
  <link rel="stylesheet" href="/css/waiting_room.css">
  <link rel="shortcut icon" type="image/jpg" href="/images/favicon.png" />
</head>
<div id="game"><div class="hud-top"><div class="accessibility-zone"></div></div></div>
<div id="waiting-room">
  <div class="title">
    <div class="colored">
      <div class="name">Game Key</div>
      <div class="text">
        <span>{{ game_id }}</span>
          <svg width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 9h3a3 3 0 013 3v6a3 3 0 01-3 3h-6a3 3 0 01-3-3v-3m6-6h-3a3 3 0 00-3 3v3m6-6V6a3 3 0 00-3-3H6a3 3 0 00-3 3v6a3 3 0 003 3h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="wait-box">
      <div class="box-header">
        <div class="info-item" title="Map">
          <span class="label">Map:</span>
          <select id="map-size-select" class="value-select hide" disabled></select>
          <span class="value" id="map-size">-</span>
        </div>
        <div class="info-item" title="Victory Points Goal">
          <span class="label">🏆</span>
          <select id="win-points-select" class="value-select hide" disabled></select>
          <span class="value" id="win-points">-</span>
        </div>
        <div class="info-item" title="Maximum Players">
          <span class="label">Players:</span>
          <select id="max-players-select" class="value-select hide" disabled></select>
          <span class="value" id="max-players-val">-</span>
        </div>
        <div class="info-item" title="Dice Mode">
          <span class="label">Dice:</span>
          <select id="dice-mode-select" class="value-select hide" disabled>
            <option value="random">Random</option>
            <option value="balanced">Balanced</option>
          </select>
          <span class="value" id="dice-mode-val">Random</span>
        </div>
        <button id="start-game-btn" class="start-game" title="Start the game (host only)" disabled>Start Game</button>
        <button class="leave-lobby" title="Leave Lobby">Leave</button>
      </div>
      <div id="slots-list" class="slots"></div>
      <div id="spectator-list" class="spectators hide">Spectators: <span>0</span></div>
    </div>
  </div>
</div>

<script>
  window.game_id = "{{ game_id }}";
  window.players = {{{ players }}};
  window.player_count = {{ player_count }};
  window.win_points = {{ win_points }};
  window.map_size = "{{ map_size }}";
  window.mapkey = {{{ mapkey }}};
  window.dice_mode = "{{ dice_mode }}";
  window.my_pid = "{{ my_pid }}";
  window.host_pid = "{{ host_pid }}";
  window.spectators_count = {{ spectators_count }};
</script>
<script src="/socket.io/socket.io.min.js"></script>
<script src="/js/waiting_room.js" type="module"></script>
