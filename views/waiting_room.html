<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{t.page.title}}</title>
  {{> meta}}
  <link rel="stylesheet" href="/css/waiting_room.css">
  <link rel="shortcut icon" type="image/jpg" href="/images/favicon.png" />
</head>
<div id="game"><div class="hud-top"><div class="accessibility-zone"></div></div></div>
<div id="waiting-room">
  <div class="container">
    <div class="wait-box">
      <div class="title">
        <div class="name" id="game-key-caption" role="status">{{t.lobby.game_key}}</div>
        <button type="button" class="text" aria-label="{{copy_invite_aria}}" title="{{t.lobby.copy_invite}}">
          <span>{{ game_key }}</span>
          <span class="copy-mark" aria-hidden="true">
            <svg class="copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 9V6.5A2.5 2.5 0 0 0 12.5 4h-6A2.5 2.5 0 0 0 4 6.5v6A2.5 2.5 0 0 0 6.5 15H9"/></svg>
            <svg class="check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
          </span>
        </button>
      </div>
      <div class="box-header">
        <div class="info-item" title="{{t.lobby.map}}">
          <label class="label" for="map-size-select">{{t.lobby.map_size}}</label>
          <select id="map-size-select" class="field value-select hide" disabled></select>
          <span class="value" id="map-size">-</span>
        </div>
        <div class="info-item" title="{{t.lobby.vp_goal}}">
          <label class="label" for="win-points-select">{{t.lobby.victory_points}}</label>
          <select id="win-points-select" class="field value-select hide" disabled></select>
          <span class="value" id="win-points">-</span>
        </div>
        <div class="info-item" title="{{t.lobby.max_players}}">
          <label class="label" for="max-players-select">{{t.lobby.players}}</label>
          <select id="max-players-select" class="field value-select hide" disabled></select>
          <span class="value" id="max-players-val">-</span>
        </div>
        <div class="info-item" title="{{t.lobby.dice_mode}}">
          <label class="label" for="dice-mode-select">{{t.lobby.dice_mode}}</label>
          <select id="dice-mode-select" class="field value-select hide" disabled>
            <option value="random">{{t.names.dice_modes.random}}</option>
            <option value="balanced">{{t.names.dice_modes.balanced}}</option>
          </select>
          <span class="value" id="dice-mode-val">{{t.names.dice_modes.random}}</span>
        </div>
        <button id="start-game-btn" class="btn btn--primary btn--sm start-game" title="{{t.lobby.start_title}}" disabled>{{t.lobby.start_game}}</button>
        <button class="btn btn--danger btn--sm leave-lobby" title="{{t.lobby.leave_title}}">{{t.lobby.leave}}</button>
      </div>
      <div id="slots-list" class="slots"></div>
      <div id="spectator-list" class="spectators hide">{{t.lobby.spectators}} <span>0</span></div>
    </div>
  </div>
</div>

<script>
  window.game_id = {{{ game_id }}};
  window.players = {{{ players }}};
  window.player_count = {{ player_count }};
  window.win_points = {{ win_points }};
  window.map_size = {{{ map_size }}};
  window.mapkey = {{{ mapkey }}};
  window.dice_mode = {{{ dice_mode }}};
  window.my_pid = {{{ my_pid }}};
  window.host_pid = {{{ host_pid }}};
  window.spectators_count = {{ spectators_count }};
</script>
<script src="/socket.io/socket.io.min.js"></script>
<script src="/js/waiting_room.js" type="module"></script>
</html>
