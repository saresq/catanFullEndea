<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catan Full Endea</title>
  {{> meta}}
  <link rel="stylesheet" href="/css/waiting_room.css">
  <link rel="shortcut icon" type="image/jpg" href="/images/favicon.png" />
</head>
<div id="game"><div class="hud-top"><div class="accessibility-zone"></div></div></div>
<div id="waiting-room">
  <div class="container">
    <div class="wait-box">
      <div class="title">
        <div class="name" id="game-key-caption" role="status">Game Key</div>
        <button type="button" class="text" aria-label="Game key {{ game_key }}: copy invite link" title="Copy invite link">
          <span>{{ game_key }}</span>
          <span class="copy-mark" aria-hidden="true">
            <svg class="copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 9V6.5A2.5 2.5 0 0 0 12.5 4h-6A2.5 2.5 0 0 0 4 6.5v6A2.5 2.5 0 0 0 6.5 15H9"/></svg>
            <svg class="check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
          </span>
        </button>
      </div>
      <div class="box-header">
        <div class="info-item" title="Map">
          <label class="label" for="map-size-select">Map Size</label>
          <select id="map-size-select" class="field value-select hide" disabled></select>
          <span class="value" id="map-size">-</span>
        </div>
        <div class="info-item" title="Victory Points Goal">
          <label class="label" for="win-points-select">Victory Points</label>
          <select id="win-points-select" class="field value-select hide" disabled></select>
          <span class="value" id="win-points">-</span>
        </div>
        <div class="info-item" title="Maximum Players">
          <label class="label" for="max-players-select">Players</label>
          <select id="max-players-select" class="field value-select hide" disabled></select>
          <span class="value" id="max-players-val">-</span>
        </div>
        <div class="info-item" title="Dice Mode">
          <label class="label" for="dice-mode-select">Dice Mode</label>
          <select id="dice-mode-select" class="field value-select hide" disabled>
            <option value="random">Random</option>
            <option value="balanced">Balanced</option>
          </select>
          <span class="value" id="dice-mode-val">Random</span>
        </div>
        <button id="start-game-btn" class="btn btn--primary btn--sm start-game" title="Start the game (host only)" disabled>Start Game</button>
        <button class="btn btn--danger btn--sm leave-lobby" title="Leave Lobby">Leave</button>
      </div>
      <div id="slots-list" class="slots"></div>
      <div id="spectator-list" class="spectators hide">Spectators: <span>0</span></div>
    </div>
  </div>
</div>

<script>
  window.game_id = {{{ game_id }}};
  window.players = {{{ players }}};
  window.player_count = {{ player_count }};
  window.win_points = {{ win_points }};
  window.map_size = {{{ map_size }}};
  window.mapkey = {{{ mapkey }}};
  window.dice_mode = {{{ dice_mode }}};
  window.my_pid = {{{ my_pid }}};
  window.host_pid = {{{ host_pid }}};
  window.spectators_count = {{ spectators_count }};
</script>
<script src="/socket.io/socket.io.min.js"></script>
<script src="/js/waiting_room.js" type="module"></script>
